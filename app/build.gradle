apply plugin: 'com.android.application'

android {
    namespace 'com.fastsmartsystem.cleoeditor'
    compileSdk 35

    defaultConfig {
        applicationId "com.fastsmartsystem.cleoeditor"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dataBinding {
        enabled = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.navigation:navigation-ui:2.8.6'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.8.7'
    implementation project(path: ':editor')
}